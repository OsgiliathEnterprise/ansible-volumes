---

dist: noble

language: python
python:
  - "3.13"
addons:
  apt:
    sources:
      - sourceline: 'deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main'
        key_url: 'https://apt.releases.hashicorp.com/gpg'
    update: true
    packages:
      - bridge-utils
      - dnsmasq-base
      - ebtables
      - virtinst
      - libvirt-dev
      - libvirt-daemon-system
      - qemu-kvm
      - qemu-utils
      - ruby-dev
      - ca-certificates
      - curl
      - gcc
      - iproute2
      - sudo
      - vagrant

install:
  - vagrant plugin install vagrant-libvirt
  - pip install uv
  - sudo chmod o+rwx /var/run/libvirt/libvirt-sock

script:
  - mv ../ansible-volumes ../tcharl.ansible_volumes
  - travis_wait 30 uv tool run --python 3.13 --with tox tox -e test-exec -- --scenario-name kvm
branches:
  only:
    - master
